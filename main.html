<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Employee Registration</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link
        href="https://googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="fullcontainer">
        <header>
            <div>
                <h4>New Employee Registration</h4>
                <p>Complete the form below to register a new team member</p>
            </div>
            <div>
                <button type="button" onclick="dash()">Login Data</button>
            </div>
        </header>

        <div class="hrdiv">
            <div>
                <p id="Personalinfo"><span>1</span> Personal info</p>
            </div>
            <div class="line"></div>
            <div class="hrin">
                <p><span>2</span> Employment</p>
            </div>
            <div class="line"></div>
            <div class="hrin">
                <p><span>3</span> Review</p>
            </div>
        </div>

        <div id="subtwo">
            <div class="one">
                <h3 class="Personal">Personal information</h3>
                <div class="space">
                    <label class="label">First Name</label>
                    <input type="text" id="fname" placeholder="Enter First Name">
                    <p id="fnameError" class="error"></p>
                </div>
                <div class="space">
                    <label>Last Name</label>
                    <input type="text" id="lname" placeholder="Enter Last Name">
                    <p id="lnameError" class="error"></p>
                </div>
                <div class="space">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter Your Email">
                    <p id="emailError" class="error"></p>
                </div>
                <div class="space">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="Enter Your Number">
                    <p id="phoneError" class="error">Format: (xxx) xxx-xxxx</p>
                </div>
                <div class="space">
                    <label>Employee ID</label>
                    <input type="number" id="id" placeholder="Enter Your ID">
                    <p id="idError" class="error"></p>
                </div>
                <div class="space">
                    <label>Department</label>
                    <select name="departmant" id="departmant">
                        <option value="ENG">Engineering</option>
                        <option value="bcom">B.COM</option>
                        <option value="bsc">Bsc</option>
                    </select>
                </div>
                <div class="space">
                    <label>Start Date</label>
                    <input type="date" id="date">
                    <p id="dateError" class="error"></p>
                </div>
            </div>

            <div class="two">
                <h3 class="Personal">Employment Options</h3>
                <div class="seconddiv">
                    <div class="seconddivdiv">
                        <input type="checkbox" name="option" value="Full-time"> Full-time
                    </div>
                    <div class="seconddivdiv">
                        <input type="checkbox" name="option" value="Benefits Enrolled"> Benefits Enrolled
                    </div>
                    <div class="seconddivdiv">
                        <input type="checkbox" name="option" value="Parking Pass"> Parking Pass
                    </div>
                </div>

                <div>
                    <div class="officediv">
                        <p class="office">Office Floor</p>
                        <div class="radiodiv">
                            <div class="radio">
                                <input type="radio" name="floor" value="1"><span>1</span>
                            </div>
                            <div class="radio">
                                <input type="radio" name="floor" value="2"><span>2</span>
                            </div>
                            <div class="radio">
                                <input type="radio" name="floor" value="3"><span>3</span>
                            </div>
                        </div>
                    </div>
                    <p class="notes">Notes</p>
                    <textarea class="textt" id="notes"></textarea>
                    <input id="file" type="file" accept="image/*">
                    <div class="text">
                        <p class="Singnature">Signature</p>
                        <textarea id="special"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button type="button" class="cancel" onclick="clearForm()">Cancel</button>
            <button type="button" class="cancel" onclick="getdata()">Submit</button>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem("users")) || [];

        function saveToStorage(user) {
            users.push(user);
            localStorage.setItem("users", JSON.stringify(users));
            alert("Employee Registered Successfully!");
            clearForm();
        }

        function getdata() {
            let fname = document.getElementById("fname").value.trim();
            let lname = document.getElementById("lname").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let id = document.getElementById("id").value.trim();
            let date = document.getElementById("date").value;

            // Clear previous errors
            document.getElementById("fnameError").innerText = "";
            document.getElementById("lnameError").innerText = "";
            document.getElementById("emailError").innerText = "";
            document.getElementById("phoneError").innerText = "Format: (xxx) xxx-xxxx";
            document.getElementById("idError").innerText = "";
            document.getElementById("dateError").innerText = "";

            // Basic validation
            let isValid = true;
            if (!fname) {
                document.getElementById("fnameError").innerText = "First Name is required";
                isValid = false;
            }
            if (!lname) {
                document.getElementById("lnameError").innerText = "Last Name is required";
                isValid = false;
            }
            if (!email) {
                document.getElementById("emailError").innerText = "Email is required";
                isValid = false;
            }
            if (!phone) {
                document.getElementById("phoneError").innerText = "Phone is required";
                isValid = false;
            }
            if (!id) {
                document.getElementById("idError").innerText = "Employee ID is required";
                isValid = false;
            }
            if (!date) {
                document.getElementById("dateError").innerText = "Start Date is required";
                isValid = false;
            }

            if (!isValid) return;

            // Fixed 'name="option"' selector
            let types = [];
            document.querySelectorAll('input[name="option"]:checked').forEach(function (item) {
                types.push(item.value);
            });

            let image = document.getElementById("file").files;

            let user = {
                fname: fname,
                lname: lname,
                email: email,
                phone: phone,
                id: id,
                departmant: document.getElementById("departmant").value,
                date: date,
                employee: {
                    type: types.join(", "),
                    floor: document.querySelector('input[name="floor"]:checked')?.value || "",
                    notes: document.getElementById("notes").value,
                    image: "",
                    sign: document.getElementById("special").value
                }
            };

            // Check if image exists before reading
            if (image) {
                let reader = new FileReader();
                reader.onload = function () {
                    user.employee.image = reader.result;
                    saveToStorage(user);
                };
                reader.readAsDataURL(image);
            } else {
                saveToStorage(user);
            }
        }

        function clearForm() {
            document.querySelectorAll("input, textarea").forEach(input => {
                if (input.type === "checkbox" || input.type === "radio") {
                    input.checked = false;
                } else {
                    input.value = "";
                }
            });
        }

        function dash() {
            window.location.href = "logininput.html";
        }
    </script>
</body>

</html>
