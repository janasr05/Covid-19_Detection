    let etidid = null;

    function display(data) {
        let table = document.getElementById("tabledata");
        table.innerHTML = "";
        data.forEach(function (item) {
            table.innerHTML += `<tr>
            <td>${item.id}</td>
             <td>${item.title}</td>
              <td>${item.price}</td>
               <td><img src="${item.thumbnail}"></td>
               <td><button onclick="edit(${item.id})">Update</button></td>
                <td><button onclick="del(${item.id})">Delete</button></td>
            </tr>`;
        });
    }

    function create(){
        let user={
            id:data.length+1,
          title:document.getElementById("title").value,
           price:document.getElementById("price").value,
           thumbnail:document.getElementById("thumbnail").value

        };
        data.unshift(user);
        
      openpopup()
      display(data);
  
       
    }

    function edit(id) {
        let item = data.find(function (x) {
            return x.id == id;

        })
        document.getElementById("title").value = item.title;
        document.getElementById("price").value = item.price;
        document.getElementById("thumbnail").value = item.thumbnail;
        etidid = id;

        openpopup()
        console.log(item);
    }

    function savedata() {
        data.forEach(function (item) {
            if (item.id == etidid) {


                item.title = document.getElementById("title").value;
                item.price = document.getElementById("price").value;
                item.thumbnail = document.getElementById("thumbnail").value;

            }
        });
        etidid = null;
        display(data);
        closepopup()
    }

    function del(id) {
        let item = data.filter(function (item) {
            return item.id != id;
        });
        data = item;
        localStorage.setItem("data", JSON.stringify(data));
        display(item);
    }

    document.getElementById("saerch").addEventListener("input", function () {
        let title = this.value.toLowerCase().trim();
        let price = this.value;
        let result = data.filter(function (item) {
            return item.title.toLowerCase().startsWith(title); 
              item.price.toString().startsWith("price");
        });
        display(result);
        console.log(result)
    })
    function advancesearch(){
        let title=document.getElementById("title").value;
        let price=document.getElementById("price").value;
        let result=data.filter(function(item){
            return (title === ""|| item.title.value.toLowerCase().includes(title)) &&
            (price ==="" || item.price.value.toString().includes(price));
        })
    }

    document.getElementById("sort").addEventListener("change", function () {
        let value = this.value;
        let result = [...data];
        if (value === "az") {
            result.sort(function (a, b) {
                return a.title.localeCompare(b.title);
            });
        }
        if (value === "za") {
            result.sort(function (a, b) {
                return b.title.localeCompare(a.title);

            })
        }
        if (value === "low") {
            result.sort(function (a, b) {
                return a.price - b.price;
            });
        }

        if (value === "high") {
            result.sort(function (a, b) {
                return b.price - a.price;
            });
        }
        display(result);
    });


    function openpopup() {
        document.getElementById("popcontainer").style.display = "flex";
    }
    function closepopup() {
        document.getElementById("popcontainer").style.display = "none";
    }

    function save() {
        localStorage.setItem("data", JSON.stringify(data));
        display(data);

        document.getElementById("title").value = "";
        document.getElementById("price").value = "";
        document.getElementById("thumbnail").value = "";
        display(data);

    }
