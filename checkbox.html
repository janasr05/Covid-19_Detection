<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="toast" id="toast">
        <p> <i class="fa-solid fa-check" style="color: rgb(1, 3, 7);"></i>Login Successfuly !</p>
    </div>
     <div id="ttoast">
            <p> <i id="icon" class="fa-solid fa-xmark" style="color: rgb(232, 235, 239);"></i>Error </p>
            <small class="ss"> Invalid Email's Not Allow</small>
        </div>
    <div class="fullcontainer">

        <div id="imagediv">

        </div>
        <div id="logindiv">
            <h1>LOGIN YOUR ACCOUNT</h1>
            <form id="loginform">

                <div>
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter Your Email">
                    <p id="emailerror"></p>
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter Your password">
                    <p id="passworderror "></p>
                </div>
                <div class="first">
                    <input id="remember" type="checkbox" name="remember" value="remember">
                    <p class="re">Remember Me</p>
                </div>
                <div class="first">
                    <input id="accepted" type="checkbox" name="accepted" value="accepted">
                    <p class="re">Are you okey with the conditions?</p>
                </div>

                <button type="button" onclick="bin()">LOGIN</button>


            </form>
        </div>

    </div>
    <script>



        function bin() {

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;


            if (email === "test@gmail.com" && password === "12345") {
                showtoast();
                document.getElementById("loginform").reset();
                setTimeout(function () {
                    window.location.href = "bin.html";
                },1000)



            }
            else {
               inpin();
               window.location.href="checkbox.html";
            }
        };

        function showtoast() {
            let toast = document.getElementById("toast");
            toast.style.display = "block";

            setTimeout(function () {
                toast.style.display = "none";
            }, 1000)
        }
         function inpin(){
                let pin=document.getElementById("ttoast");
                pin.style.display="block";

                setTimeout(function(item){
                    pin.style.display="none";
                },1000)
            }


    </script>

</body>

</html>
