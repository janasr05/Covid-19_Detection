    <table border="1">
        <thead>
            <tr>
                <th>Id</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Departmant</th>
                <th>Date</th>
                <th>Employment Options</th>
                <th>Office Floor</th>
                <th>Notes</th>
                <th>Image</th>
                <th>Singnature</th>
            </tr>
        </thead>
        <tbody id="tabledata">

        </tbody>
    </table>

    <script>

        let users = JSON.parse(localStorage.getItem("users")) || [];
        function display(data) {
            let table = document.getElementById("tabledata");
            table.innerHTML = "";
            data.forEach(function (item) {
                table.innerHTML += `
                     <tr>
                        <td>${item.id}</td>
                        <td>${item.fname}</td>
                        <td>${item.lname}</td>
                        <td>${item.email}</td>
                        <td>${item.phone}</td>
                        <td>${item.departmant}</td>
                        <td>${item.date}</td>
                          <td>${item.employee.type}</td>
                           <td>${item.employee.floor}</td>
                            <td>${item.employee.notes}</td>
                        <td><img src="${item.employee.image}"></td>
                         <td>${item.employee.sign}</td>

                        
                        </tr>
                `;
            });
        }
        function dash(){
            window.location.href="logn.html";
        }
        display(users);
